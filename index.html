<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00843d">
<title>SAG-ZDC: Sistema de Autorização e Guarda de Chaves V1.0</title>
<style>
:root{--g:#00843d;--gd:#006a31;--gl:#e8f5ee;--r:#cd191e;--bg:#f3f6f4;--tx:#1b2a24;--mu:#5b6b63;--bd:#dfe7e2;--sh:0 1px 2px rgba(16,40,28,.06),0 6px 18px rgba(16,40,28,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column}
small,.hint{color:var(--mu);font-size:14px;margin:0}
.hint{line-height:1.45}

header{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:4px solid var(--r)}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header small{color:#d6f0e0;display:block}
.usr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.usr .who{text-align:right;line-height:1.3}
.usr .who b{display:block;font-size:15px;font-weight:600}

nav{background:#fff;display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--bd);overflow-x:auto;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(16,40,28,.04);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;color:var(--mu);border:0;border-bottom:3px solid transparent;border-radius:0;padding:0 16px;min-height:50px;white-space:nowrap;font-size:15px;font-weight:500}
nav button:hover{background:var(--gl);filter:none}
nav button.on{color:var(--g);border-color:var(--g);font-weight:700}

main{width:100%;max-width:1100px;margin:0 auto;padding:8px 20px 32px;flex:1}
h2{font-size:20px;margin:24px 0 14px;font-weight:700;display:flex;align-items:center;gap:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:stretch}
.pnl{background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:280px;text-align:center}
.pnl h2.pt{margin:0;justify-content:center;text-align:center;background:var(--gl);color:var(--gd);border-radius:12px;padding:12px 10px;font-size:18px}
.pnl .card{margin:0;box-shadow:none;background:#fafcfb;align-items:stretch}
.pnl .card .ph{justify-content:center;text-align:center;flex-direction:column;gap:8px}
.pnl .empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:12px}
.pnl.wide{min-height:0;text-align:left}
.pnl.wide .tw{margin-top:0}
.pnl.wide .row.frm{margin:0}
.pnl .card .ph.r2{flex-direction:row;justify-content:center}
.pnl .kpi,.pnl .cardx{box-shadow:none;background:#fafcfb}
.pnl .kpis,.pnl .dg2{margin-top:0}
.pnl .hint{text-align:left}
.stack{display:grid;gap:20px;margin-top:20px}
@media(max-width:700px){.pnl{min-height:0}.pnl .empty{min-height:90px}}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;box-shadow:var(--sh)}
.grid .card{margin:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ch b{font-size:17px;line-height:1.3}
.card button{width:100%;margin-top:4px}
.empty{background:#fff;border:1px dashed #c4d1ca;border-radius:14px;padding:22px;text-align:center;color:var(--mu)}
.note{background:#fff7e0;border:1px solid #f3d98b;color:#7a5600;border-radius:12px;padding:12px 14px;margin-top:16px;font-size:14px}

button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:0 18px;min-height:46px;cursor:pointer;font:inherit;font-weight:600;transition:background .15s,transform .05s}
button:hover{background:var(--gd)}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:not-allowed}
button.sec{background:#e9eeeb;color:#2f4139}
button.sec:hover{background:#dbe3df}
button.out{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.55);min-height:40px;padding:0 16px}
button.out:hover{background:rgba(255,255,255,.28)}
.link{background:#fff;color:var(--g);border:2px solid var(--g);min-height:46px;padding:0 18px;text-decoration:none;font-weight:700}
.link:hover{background:var(--gl);color:var(--gd)}

label{font-size:14px;font-weight:600;color:#33453c;display:block;margin-bottom:4px}
input,select,textarea{padding:0 14px;min-height:46px;border:1px solid #c6d2cb;border-radius:10px;font:inherit;width:100%;background:#fff;color:var(--tx)}
textarea{padding:12px 14px;resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(0,132,61,.22);border-color:var(--g)}
.fld{display:flex;flex-direction:column}
.row{display:flex;gap:10px;flex-wrap:wrap}
.frm input{flex:1 1 200px;width:auto}
.frm button{flex:0 0 auto}

.b{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap;letter-spacing:.2px}
.disponivel,.devolvida{background:#dcfce7;color:#166534}
.reservada,.solicitada,.devolucao{background:#fef3c7;color:#92400e}
.em_uso,.retirada{background:#fee2e2;color:#991b1b}
.cancelada,.expirada{background:#e5e7eb;color:#475569}
.cd{font-variant-numeric:tabular-nums;font-weight:700;color:var(--r)}
.n{background:var(--g);color:#fff;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700}

.tw{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:14px;margin-top:12px;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #edf2ef;white-space:nowrap}
th{background:#f6f9f7;color:#3d4f46;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
tbody tr:hover{background:#fafcfb}
tr:last-child td{border-bottom:0}
td select{min-width:150px}

.hb{display:flex;align-items:center;gap:12px}
.hlogo{background:#fff;border-radius:10px;padding:5px 8px;display:flex;flex:0 0 auto}
.hlogo img{height:42px;width:auto;display:block}
header small a{color:#fff;font-weight:600}

.lw{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px;position:relative;overflow:hidden;background:radial-gradient(900px 500px at 8% 0%,rgba(0,132,61,.20),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(205,25,30,.10),transparent 60%),linear-gradient(180deg,#eef5f0,#e0ebe4)}
.lw::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,106,49,.18) 1px,transparent 1.3px);background-size:22px 22px;pointer-events:none}
.lcard{position:relative;z-index:1;width:100%;max-width:880px;display:grid;grid-template-columns:5fr 6fr;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(10,50,30,.22),0 2px 6px rgba(10,50,30,.10)}
.brand{position:relative;color:#fff;text-align:center;padding:40px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px),radial-gradient(circle at 20% 12%,rgba(255,255,255,.20),transparent 45%),linear-gradient(160deg,#00a04a,#006a31 60%,#004d24)}
.brand::after{content:"";position:absolute;top:0;right:0;bottom:0;width:5px;background:var(--r)}
.logo{display:flex;margin-bottom:4px}
.logo img{display:block;height:120px;width:auto;max-width:240px;object-fit:contain;filter:invert(1) grayscale(1) brightness(20);mix-blend-mode:screen}
.brand h1{margin:6px 0 0;font-size:36px;font-weight:800;letter-spacing:1.5px}
.brand .bn{margin:0;font-size:15px;line-height:1.45;color:#d6f0e0;max-width:260px}
.brand a{color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:99px;padding:7px 18px;font-size:14px;font-weight:600;text-decoration:none;margin-top:6px;background:rgba(255,255,255,.10)}
.brand a:hover{background:rgba(255,255,255,.25)}
.login{width:100%;padding:40px 34px;display:flex;flex-direction:column;justify-content:center;gap:14px;background:linear-gradient(180deg,#fff,#f9fcfa)}
.login form{display:flex;flex-direction:column;gap:14px}
.login h3{margin:0 0 2px;font-size:24px;font-weight:700;color:var(--gd)}
@media(max-width:700px){.lw{padding:16px 12px}.lcard{grid-template-columns:1fr}.brand{padding:28px 20px}.brand::after{top:auto;left:0;width:auto;height:5px}.brand h1{font-size:28px}.logo img{height:64px}}

#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,30,22,.55);backdrop-filter:blur(3px)}
#modal.on{display:flex}
.dlg{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);border-top:5px solid var(--r)}
.dlg h3{margin:0;font-size:20px}
.dlg p{margin:0;color:var(--mu);font-size:15px}
.dlg .row button{flex:1}
button.dg{background:var(--r)}
button.dg:hover{background:#a81418}
button.dgo{background:#fff;color:var(--r);border:2px solid var(--r)}
button.dgo:hover{background:#fdecec}
main button:not(.chip),.login button,.dlg button{box-shadow:0 1px 3px rgba(16,40,28,.22)}
.hold{background:var(--gl);border-radius:10px;padding:8px 10px}
.hold small{color:var(--tx)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;min-height:62px}
.opt:hover{background:var(--gl)}
.opt .ot{flex:1;display:flex;flex-direction:column;min-width:0}
.opt .ot small{overflow-wrap:anywhere}
.opt .oa{color:var(--g);font-size:24px;font-weight:700;line-height:1}
.opts{display:flex;flex-direction:column;gap:8px}

pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:12px;overflow:auto;font-size:12.5px;line-height:1.5}
code{background:#e9eeeb;padding:1px 6px;border-radius:5px;font-size:13px}
ol li{margin-bottom:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15px}
#toast.err{background:#b91c1c}
.pcard{background:var(--gl);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.pi{background:#fff;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.pi span{font-weight:600;overflow-wrap:anywhere}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.pst div{background:#fff;border-radius:10px;padding:8px}
.pst b{display:block;font-size:22px;color:var(--gd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:14px 10px;text-align:center}
.kpi b{display:block;font-size:26px;line-height:1.15;color:var(--gd)}
.kpi.r b{color:var(--r)}
.kpi small{display:block;margin-top:4px}
.dg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.cardx{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:16px}
.cardx h3{margin:0 0 12px;font-size:16px}
.hb2{display:grid;grid-template-columns:minmax(70px,38%) 1fr 34px;gap:8px;align-items:center;font-size:14px;margin-bottom:8px}
.hb2 .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb2 .ht{background:var(--gl);border-radius:99px;height:12px;overflow:hidden}
.hb2 .ht i{display:block;height:100%;background:var(--g);border-radius:99px}
.hb2 b{text-align:right}
.cc{display:flex;align-items:flex-end;gap:2px;height:120px}
.cb{flex:1;height:100%;display:flex;align-items:flex-end;background:#f6f9f7;border-radius:3px 3px 0 0}
.cb i{display:block;width:100%;background:var(--g);border-radius:3px 3px 0 0}
.cx{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:4px}
.stk{display:flex;height:18px;border-radius:99px;overflow:hidden;background:#e5e7eb;margin-bottom:8px}
.stk i{display:block;height:100%}
.demo{background:#fef3c7;color:#92400e;padding:8px 20px;font-size:13px;text-align:center}

.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--gl);color:var(--gd);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.av.lg{width:88px;height:88px;font-size:28px}
.av.sm{width:34px;height:34px;font-size:13px}
.av.md{width:52px;height:52px;font-size:18px}
img.av{cursor:zoom-in}
#zoom{position:fixed;z-index:70;display:none;pointer-events:none;width:220px;height:220px;border-radius:16px;object-fit:cover;background:#fff;border:3px solid #fff;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#zoom.on{display:block}
.lbimg{width:min(80vw,320px);height:min(80vw,320px);object-fit:cover;border-radius:16px;cursor:zoom-out}
.ph{display:flex;align-items:center;gap:12px}
.ph input{flex:1;min-width:0;padding:10px}
footer{background:#fff;border-top:1px solid var(--bd);text-align:center;padding:18px 16px;font-size:14px;color:var(--mu)}
footer a{color:var(--g);font-weight:700;text-decoration:none}
footer a:hover{text-decoration:underline}

@media(max-width:700px){
  header{padding:12px 16px}
  header h1{font-size:18px}
  .usr{width:100%;justify-content:space-between}
  .usr .who{text-align:left}
  main{padding:4px 14px 28px}
  h2{font-size:19px;margin:20px 0 12px}
  .grid{grid-template-columns:1fr}
  nav{padding:0 6px}
  nav button{padding:0 14px}
  .frm button{width:100%}
  .login{padding:24px 18px}

  .tw{background:none;border:0;box-shadow:none;overflow:visible}
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
  .rt tr{background:#fff;border:1px solid var(--bd);border-radius:14px;margin-bottom:12px;padding:8px 14px;box-shadow:var(--sh)}
  .rt td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;padding:6px 0;white-space:normal;text-align:right;font-size:14px}
  .rt td::before{content:attr(data-label);font-weight:600;color:var(--mu);text-align:left;flex:0 0 auto}
  .rt td select{min-width:0;width:60%}
  .rt td.act{padding-top:10px}
  .rt td.act::before{content:none}
  .rt td.act button{width:100%}
}

button{touch-action:manipulation}
.ic,.ls{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0 4px;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
button.chip{flex:0 0 auto;background:#fff;color:var(--mu);border:1px solid var(--bd);border-radius:99px;min-height:38px;padding:0 16px;font-size:14px}
button.chip:hover{background:var(--gl)}
button.chip.on,button.chip.on:hover{background:var(--g);color:#fff;border-color:var(--g)}
tr.dgp td{background:#f6f9f7;color:#3d4f46;font-weight:700;font-size:13px;text-transform:capitalize;padding:8px 14px}
tr.dgp:hover td{background:#f6f9f7}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

@media(max-width:700px){
  body:has(nav){padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:15;flex-wrap:nowrap;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom-width:3px}
  .hb{gap:10px;min-width:0}
  .hlogo{padding:4px 6px;border-radius:8px}
  .hlogo img{height:30px}
  header h1{font-size:17px}
  .hb small{display:none}
  .usr{width:auto;gap:8px;flex-wrap:nowrap}
  .usr .who{display:none}
  .av{width:36px;height:36px}
  button.out{min-height:36px;padding:0 12px;font-size:14px}
  .lf{display:none}
  .ls{display:inline}

  nav{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:20;padding:0 4px env(safe-area-inset-bottom);border-bottom:0;border-top:1px solid var(--bd);box-shadow:0 -6px 20px rgba(16,40,28,.10)}
  nav button{flex:1 0 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;min-height:60px;padding:6px 4px;border-bottom:0;border-top:3px solid transparent;font-size:11px;font-weight:600}
  nav button.on{border-top-color:var(--g);background:var(--gl)}
  nav button .ic{display:block;font-size:20px;line-height:1}
  nav .n{position:absolute;top:4px;left:50%;margin-left:8px;font-size:10px;padding:0 6px;background:var(--r)}

  main{padding:6px 14px 24px}
  h2{font-size:18px}
  .card{border-radius:16px}
  .card button{min-height:50px;border-radius:12px;font-size:16px}
  .chips{margin:12px -14px 4px;padding:2px 14px}
  .rt tr.dgp{background:none;border:0;box-shadow:none;padding:0;margin:16px 0 6px}
  .rt tr.dgp td{display:block;background:none;padding:0 2px;font-size:13px;color:var(--mu);text-align:left}
  .rt td.em{display:none}
  .rt td[data-label="Chave"]{font-weight:700;font-size:16px}

  .brand{padding:22px 20px;gap:6px}
  .brand .bn{font-size:13px}
  #modal{align-items:flex-end;padding:0}
  .dlg{max-width:none;border-top:0;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:12px 20px calc(20px + env(safe-area-inset-bottom));animation:sheet .22s ease-out}
  .dlg::before{content:"";width:42px;height:4px;border-radius:9px;background:#cdd7d1;align-self:center;flex:0 0 auto}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
}
</style>
</head>

const CDN = 'https://www.gstatic.com/firebasejs/10.12.0';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => t ? new Date(t).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '—';
const uid = () => Math.random().toString(36).slice(2, 10);
const ini = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const av = (n, f, c = '') => f ? `<img class="av ${c}" src="${f}" alt="${esc(n)}">` : `<span class="av ${c}">${esc(ini(n))}</span>`;
const fotoDe = id => S.user && S.user.uid === id ? S.user.foto : (S.data.users.find(x => x.uid === id) || {}).foto;
const readFoto = file => new Promise((ok, no) => {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {

  const emit = () => {
    const m = d.users.find(x => x.uid === (S.user || {}).uid);
    fn({keys:d.keys.map(x => ({...x})), reqs:d.reqs.map(x => ({...x})), users:d.users.map(x => ({...x})), logs:d.logs.map(x => ({...x})), me:m && {...m}});

    async register() { throw Error('Cadastro disponível apenas com Firebase configurado.'); },

    async confirmPass(p) { if (!p) throw Error('Informe a senha.'); },
    async changeEmail(p, novo) { await this.confirmPass(p); d.users.find(x => x.uid === S.user.uid).email = novo; S.user.email = novo; emit(); },
    async changePass(p) { await this.confirmPass(p); },
    listen(u, f) { fn = f; emit(); return () => {}; },

    async reactivate(id) { const u = d.users.find(x => x.uid === id); u.suspenso = false; delete u.motivoSusp; delete u.suspPor; delete u.tSusp; emit(); },
    async rejectUser(id) { d.users = d.users.filter(x => x.uid !== id); emit(); },
    async me() { return S.user; },
    async setFoto(id, f) { d.users.find(x => x.uid === id).foto = f; emit(); },
    async saveProfile(id, data) { Object.assign(d.users.find(x => x.uid === id), data); emit(); },
    async requestFoto(id, f) { d.users.find(x => x.uid === id).fotoPendente = f; emit(); },
    async approveFoto(id, f) { const u = d.users.find(x => x.uid === id); u.foto = f; delete u.fotoPendente; emit(); },
    async rejectFoto(id) { delete d.users.find(x => x.uid === id).fotoPendente; emit(); }
  };
}

/* ===================== BACKEND: FIREBASE ===================== */
async function makeFB() {
  const [{initializeApp}, A, F] = await Promise.all(['app','auth','firestore'].map(m => import(`${CDN}/firebase-${m}.js`)));
  const app = initializeApp(firebaseConfig), auth = A.getAuth(app), db = F.getFirestore(app);
  try { await A.setPersistence(auth, A.browserSessionPersistence); } catch (_) {}
  const col = n => F.collection(db, n), ref = (n, id) => F.doc(db, n, id);
  let cb = () => {}, reg = false;
  const lg = (u, acao, alvo, detalhe) => ({uid:u.uid, autor:u.nome, acao, alvo:alvo || '', detalhe:detalhe || '', t:F.serverTimestamp()});
  return {
    demo: false,
    onAuth(f) {
      cb = f;
      A.onAuthStateChanged(auth, async u => {
        if (reg) return;
        if (!u) return f(null);
        const s = await F.getDoc(ref('users', u.uid));
        if (!s.exists()) { toast('Cadastro recusado ou inexistente.', 1); await A.signOut(auth); return f(null); }
        const d = s.data();
        if (u.email && d.email !== u.email) { try { await F.updateDoc(ref('users', u.uid), {email:u.email}); d.email = u.email; } catch (_) {} }
        f({uid:u.uid, ...d});
      });
    },
    async login(e, p) { await A.signInWithEmailAndPassword(auth, e, p); },
    async register(nome, siape, cargo, e, p, foto, idTipo) {
      reg = true;
      try {
        const c = await A.createUserWithEmailAndPassword(auth, e, p);
        const prof = {nome, siape, idTipo, cargo, foto, email:e, role:'funcionario', aprovado:false, tCad:Date.now()};
        await F.setDoc(ref('users', c.user.uid), prof);
        cb({uid:c.user.uid, ...prof});
      } finally { reg = false; }
    },
    logout() { return A.signOut(auth); },
    async confirmPass(p) {
      const u = auth.currentUser;
      try { await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, p)); }
      catch (e) {
        if (/credential|password/.test(e.code || '')) throw Error('Senha incorreta.');
        throw e;
      }
    },
    async changePass(atual, nova) {
      await this.confirmPass(atual);
      await A.updatePassword(auth.currentUser, nova);
    },
    async changeEmail(atual, novo) {
      await this.confirmPass(atual);
      await A.verifyBeforeUpdateEmail(auth.currentUser, novo);
    },
    listen(u, fn) {
      const st = {keys:[], reqs:[], users:[], logs:[]}, emit = () => fn({...st});
      const q = u.role === 'funcionario'
        ? F.query(col('requests'), F.where('userId', '==', u.uid))
        : F.query(col('requests'), F.orderBy('tSol', 'desc'), F.limit(300));
      const un = [
        F.onSnapshot(ref('users', u.uid), s => { if (s.exists()) { st.me = {uid:s.id, ...s.data()}; emit(); } }),
        F.onSnapshot(col('keys'), s => { st.keys = s.docs.map(d => ({id:d.id, ...d.data()})); emit(); }),
        F.onSnapshot(q, s => { st.reqs = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a, b) => b.tSol - a.tSol); emit(); }, e => toast(msg(e), 1))
      ];
      un.push(F.onSnapshot(col('users'), s => { st.users = s.docs.map(d => ({uid:d.id, ...d.data()})); emit(); }));
      if (u.role === 'admin') un.push(F.onSnapshot(F.query(col('logs'), F.orderBy('t', 'desc'), F.limit(500)), s => { st.logs = s.docs.map(d => { const x = d.data(); return {id:d.id, ...x, t:x.t ? x.t.toMillis() : Date.now()}; }); emit(); }, e => toast(msg(e), 1)));
      if (u.role === 'funcionario') un.push(F.onSnapshot(F.query(col('requests'), F.orderBy('tSol', 'desc'), F.limit(500)), s => { st.all = s.docs.map(d => d.data()); emit(); }, () => {}));
      return () => un.forEach(f => f());
    },
    async request(k, u) {
      const kr = ref('keys', k.id), rr = F.doc(col('requests'));
      await F.runTransaction(db, async t => {
        const s = await t.get(kr);
        if (s.data().status !== 'disponivel') throw Error('Chave indisponível.');
        t.update(kr, {status:'reservada', portador:u.nome, portadorId:u.uid, desde:Date.now()});
        t.set(rr, {keyId:k.id, keyName:k.nome, userId:u.uid, userName:u.nome, status:'solicitada', tSol:Date.now()});
        t.set(F.doc(col('logs')), lg(u, 'solicitar_chave', k.nome, k.local));
      });
    },
    async act(a, id, u) {
      const t = T[a], rr = ref('requests', id);
      await F.runTransaction(db, async tx => {
        const r = (await tx.get(rr)).data();
        if (r.status !== t.from) throw Error('Status já foi alterado.');
        const up = {status:t.to, [t.ts]:Date.now()};
        if (t.who) up[t.who] = u.nome;
        Object.assign(up, t.extra);
        tx.update(rr, up);
        tx.update(ref('keys', r.keyId), keyUp(t, r));
        tx.set(F.doc(col('logs')), lg(u, t.log, r.keyName, ld(t, r)));
      });
    },
    addKey(k) { return F.addDoc(col('keys'), {...k, status:'disponivel'}); },
    log(u, acao, alvo, detalhe) { return F.addDoc(col('logs'), lg(u, acao, alvo, detalhe)); },
    delKey(id) { return F.deleteDoc(ref('keys', id)); },
    setRole(id, role) { return F.updateDoc(ref('users', id), {role}); },
    setApproval(id, ok) { return F.updateDoc(ref('users', id), {aprovado:ok}); },
    suspend(id, motivo, por) { return F.updateDoc(ref('users', id), {suspenso:true, motivoSusp:motivo, suspPor:por, tSusp:Date.now()}); },
    reactivate(id) { return F.updateDoc(ref('users', id), {suspenso:false, motivoSusp:F.deleteField(), suspPor:F.deleteField(), tSusp:F.deleteField()}); },
    rejectUser(id) { return F.deleteDoc(ref('users', id)); },
    setFoto(id, foto) { return F.updateDoc(ref('users', id), {foto}); },
    saveProfile(id, data) { return F.updateDoc(ref('users', id), data); },
    requestFoto(id, fotoPendente) { return F.updateDoc(ref('users', id), {fotoPendente}); },
    approveFoto(id, foto) { return F.updateDoc(ref('users', id), {foto, fotoPendente:F.deleteField()}); },
    rejectFoto(id) { return F.updateDoc(ref('users', id), {fotoPendente:F.deleteField()}); },
    async me() { const u = auth.currentUser; const s = await F.getDoc(ref('users', u.uid)); return {uid:u.uid, ...s.data()}; }
  };
}

const vDash = () => {

  const exp = rs.filter(r => r.expirada).length, canc = cnt('cancelada') - exp;
  const ret = rs.filter(r => r.tRet), dev = rs.filter(r => r.tRet && r.tDev);
  const avgUse = dev.length ? dev.reduce((a, r) => a + r.tDev - r.tRet, 0) / dev.length : 0;
  const avgWait = ret.length ? ret.reduce((a, r) => a + r.tRet - r.tSol, 0) / ret.length : 0;
  const nd = S.dp === 'all' ? 30 : +S.dp;
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const b0 = t0.getTime() - (nd - 1) * DAY;

  const hv = Array(24).fill(0), wv = Array(7).fill(0);

  const kd = keys.filter(k => k.status === 'disponivel').length, kr = keys.filter(k => k.status === 'reservada').length, ku = keys.length - kd - kr;
  const pc = x => keys.length ? x / keys.length * 100 : 0;

  <div class="kpis">

    ${kpi(canc, 'Canceladas')}${kpi(exp, 'Expiradas (3 min)', 'r')}${kpi((n ? Math.round(exp / n * 100) : 0) + '%', 'Taxa de expiração', 'r')}
    ${kpi(dev.length ? dur(avgUse) : '—', 'Tempo médio de uso')}${kpi(ret.length ? dur(avgWait) : '—', 'Espera média até a entrega')}
    ${kpi(pessoas, 'Pessoas que usaram')}${kpi(S.data.users.filter(u => u.aprovado !== false).length, 'Usuários cadastrados')}</div>
  <div class="dg2">
    ${nd > 1 ? `<div class="cardx"><h3>Solicitações por dia (${nd} dias)</h3>${colc(dv, dl)}</div>` : ''}
    <div class="cardx"><h3>Solicitações por horário</h3>${colc(hv, hv.map((_, i) => String(i).padStart(2, '0') + 'h'))}</div>
    <div class="cardx"><h3>Por dia da semana</h3>${hbar(WD.map((d, i) => [d, wv[i]]))}</div>

};

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function role() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role; }
    function active() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.get('suspenso', false) != true; }
    function staff() { return request.auth != null && role() in ['guarda','admin'] && active(); }
    function approved() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.get('aprovado', true) != false && active(); }
    match /users/{id} {
      allow read: if request.auth != null;
      allow create: if request.auth.uid == id && request.resource.data.role == 'funcionario' && request.resource.data.aprovado == false && request.resource.data.foto is string && request.resource.data.foto.size() > 100 && request.resource.data.foto.size() < 100000;
      allow update: if request.auth != null && (role() == 'admin' || (request.auth.uid == id
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['foto','fotoPendente','email','telefone','setor','nascimento','cidade','bio','siape','idTipo'])
        && request.resource.data.get('bio', '').size() <= 300
        && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['email']) || request.resource.data.email == request.auth.token.email)
        && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['foto']) || !(resource.data.get('foto', '') is string && resource.data.get('foto', '').size() > 100))
        && request.resource.data.foto is string && request.resource.data.foto.size() < 100000
        && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['fotoPendente']) || (request.resource.data.fotoPendente is string && request.resource.data.fotoPendente.size() < 100000))));
      allow delete: if request.auth != null && role() == 'admin';
    }
    match /keys/{id} {
      allow read: if request.auth != null;
      allow create, delete: if request.auth != null && role() == 'admin';
      allow update: if request.auth != null && active() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','portador','portadorId','desde']);
    }
    match /requests/{id} {
      allow read: if request.auth != null && approved();
      allow create: if request.auth != null && approved() && request.resource.data.userId == request.auth.uid && request.resource.data.status == 'solicitada';
      allow update: if staff() || (request.auth != null && resource.data.userId == request.auth.uid && active() && request.resource.data.status in ['devolucao','cancelada']);
    }
    match /logs/{id} {
      allow read: if request.auth != null && role() == 'admin';
      allow create: if request.auth != null && active()
        && request.resource.data.keys().hasOnly(['uid','autor','acao','alvo','detalhe','t'])
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.t == request.time;
      allow update, delete: if false;
    }
  }
}`;

document.addEventListener('click', async e => {
  const im = e.target.closest('img.av');
  if (im && !im.closest('#modal')) { openFoto(im); return; }
  const b = e.target.closest('[data-a]');
  if (!b || b.tagName === 'SELECT') return;
  const a = b.dataset.a, id = b.dataset.id;
  try {
    if (a === 'tab') { S.tab = id; S.lim = 30; render(); return; }
    if (a === 'fs') { S.fs = id; S.lim = 30; render(); return; }
    if (a === 'more') { S.lim += 30; updHist(); return; }
    if (a === 'lmore') { S.ll += 50; updLogs(); return; }
    if (a === 'mode') { S.mode = id; render(); return; }
    if (a === 'demo') { pendLogin = true; await B.login(id); return; }
    if (a === 'closeModal') { closeModal(); return; }
    if (a === 'conta') { openConta(); return; }
    if (a === 'contaView') { openConta(id); return; }
    if (a === 'logout') { if (canLog(S.user)) await audit('logout', S.user.nome); await B.logout(); return; }
    if (a === 'recheck') {
      const m = await B.me();
      if (m.aprovado === false) toast('Ainda aguardando autorização.', 1);
      else if (m.suspenso) { start(m); toast('A conta continua suspensa.', 1); }
      else { pendLogin = true; start(m); }
      return;
    }
    b.disabled = true;
    if (a === 'request') { await B.request(S.data.keys.find(k => k.id === id), S.user); toast('Chave solicitada! Retire na guarita.'); S.tab = 'minhas'; render(); }
    else if (T[a]) {
      const rq = S.data.reqs.find(x => x.id === id);
      if (a === 'deliver' && rq && rq.tSol + TTL <= Date.now()) throw Error('Reserva expirada (mais de 3 minutos).');
      await B.act(a, id, S.user); toast('Registrado com sucesso.');
    }
    else if (a === 'approve') { await B.setApproval(id, true); audit('aprovar_cadastro', nomeU(id)); toast('Conta autorizada.'); }
    else if (a === 'reject') { const n = nomeU(id); await B.rejectUser(id); audit('recusar_cadastro', n); toast('Solicitação recusada.'); }
    else if (a === 'photoOk') { await B.approveFoto(id, S.data.users.find(x => x.uid === id).fotoPendente); audit('aprovar_foto', nomeU(id)); toast('Nova foto autorizada.'); }
    else if (a === 'photoNo') { await B.rejectFoto(id); audit('recusar_foto', nomeU(id)); toast('Troca de foto recusada.'); }
    else if (a === 'delKey') {
      const k = S.data.keys.find(k => k.id === id);
      if (k.status !== 'disponivel') throw Error('Chave em uso não pode ser excluída.');
      b.disabled = false; openDel(k);
    }
    else if (a === 'delUser') {
      const u = S.data.users.find(x => x.uid === id);
      if (id === S.user.uid) throw Error('Você não pode excluir a própria conta.');
      if (S.data.reqs.some(r => r.userId === id && ['solicitada','retirada','devolucao'].includes(r.status))) throw Error('Usuário possui chave em andamento.');
      b.disabled = false; openDel({id, nome:u.nome}, true);
    }
    else if (a === 'suspender') {
      const u = S.data.users.find(x => x.uid === id);
      if (id === S.user.uid) throw Error('Você não pode suspender a própria conta.');
      if (S.data.reqs.some(r => r.userId === id && ABERTO.includes(r.status))) throw Error('Usuário possui chave em andamento.');
      b.disabled = false; openSusp({id, nome:u.nome});
    }
    else if (a === 'reativar') {
      await B.reactivate(id); audit('reativar', nomeU(id)); toast('Conta reativada.');
    }
  } catch (err) { toast(msg(err), 1); b.disabled = false; }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, v = Object.fromEntries(new FormData(f));
  try {
    if (f.id === 'fLogin') { pendLogin = true; await B.login(v.email, v.senha); }
    else if (f.id === 'fReg') {
      if (v.senha !== v.senha2) throw Error('As senhas não conferem.');
      if (!v.foto || !v.foto.size) throw Error('A foto é obrigatória.');
      const foto = await readFoto(v.foto);
      await B.register(v.nome.trim(), v.siape.trim() || '—', v.cargo, v.email, v.senha, foto, v.siape.trim() ? v.idTipo : '');
      toast('Cadastro enviado. Aguarde a autorização do administrador.');
    }
    else if (f.id === 'fMail') {
      const novo = v.novo.trim();
      if (novo.toLowerCase() === String(S.user.email).toLowerCase()) throw Error('O novo e-mail é igual ao atual.');
      await B.changeEmail(v.senha, novo);
      closeModal();
      toast(B.demo ? 'E-mail atualizado.' : 'Enviamos um link de confirmação para o novo e-mail. A troca vale após clicar nele.');
    }
    else if (f.id === 'fPass') {
      if (v.nova !== v.nova2) throw Error('As senhas não conferem.');
      if (v.nova === v.senha) throw Error('A nova senha deve ser diferente da atual.');
      await B.changePass(v.senha, v.nova);
      closeModal();
      toast('Senha alterada com sucesso.');
    }
    else if (f.id === 'fSusp') {
      const motivo = v.motivo.trim();
      if (motivo.length < 5) throw Error('Informe o motivo da suspensão.');
      const btn = f.querySelector('.dg'); btn.disabled = true;
      try { const al = nomeU(S.susp); await B.suspend(S.susp, motivo, S.user.nome); audit('suspender', al, motivo); closeModal(); toast('Conta suspensa.'); }
      catch (err) { btn.disabled = false; throw err; }
    }
    else if (f.id === 'fPerf') {
      if (v.nascimento && new Date(v.nascimento) > new Date()) throw Error('Data de nascimento inválida.');
      const sp = v.siape.trim();
      const d = {telefone:v.telefone.trim(), setor:v.setor.trim(), nascimento:v.nascimento, cidade:v.cidade.trim(), bio:v.bio.trim(), siape:sp || '—', idTipo:sp ? v.idTipo : ''};
      await B.saveProfile(S.user.uid, d); Object.assign(S.user, d);
      toast('Informações salvas.'); render(); openConta();
    }
    else if (f.id === 'fKey') { await B.addKey({nome:v.nome.trim(), local:v.local.trim()}); audit('criar_chave', v.nome.trim(), v.local.trim()); f.reset(); }
    else if (f.id === 'fDel') {
      if (S.user.role !== 'admin') throw Error('Apenas administradores podem excluir chaves.');
      const btn = f.querySelector('.dg'); btn.disabled = true;
      const isU = S.delUser;
      try {
        const alvo = isU ? nomeU(S.del) : (S.data.keys.find(k => k.id === S.del) || {}).nome;
        await B.confirmPass(v.senha); await (isU ? B.rejectUser(S.del) : B.delKey(S.del));
        audit(isU ? 'excluir_usuario' : 'excluir_chave', alvo);
        closeModal(); toast(isU ? 'Conta excluída.' : 'Chave excluída.');
      }
      catch (err) { btn.disabled = false; throw err; }
    }
  } catch (err) { pendLogin = false; toast(msg(err), 1); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; S.lim = 30; updHist(); }
  if (e.target.id === 'lq') { S.lq = e.target.value; S.ll = 50; updLogs(); }

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'foto' || t.id === 'fotoMe' || t.id === 'fotoReq') {
    const file = t.files[0]; if (!file) return;

    } catch (err) { toast(msg(err), 1); t.value = ''; }
    return;

  if (t.dataset.a === 'lper') { S.lp = t.value; S.ll = 50; render(); return; }

  if (e.target.dataset.a === 'role') {
    try {
      const id = e.target.dataset.id, uu = S.data.users.find(x => x.uid === id) || {};

/* ===================== EXPIRAÇÃO DE RESERVAS ===================== */
const expBusy = new Set();
const IDLE = 5 * 60 * 1000;
let pendLogin = false, lastAct = Date.now(), idleWarn = false, outBusy = false;
['mousemove','mousedown','keydown','touchstart','scroll','wheel','click'].forEach(ev =>
  addEventListener(ev, () => { lastAct = Date.now(); idleWarn = false; }, {passive:true, capture:true}));
const canLog = u => u && u.aprovado !== false && !u.suspenso;
async function idleOut() {
  outBusy = true;
  try {
    if (canLog(S.user)) await audit('logout_inativo', S.user.nome, 'Sem interação por 5 minutos');
    closeModal(); await B.logout();
    toast('Sessão encerrada por inatividade (5 minutos).', 1);
  } catch (_) {} finally { outBusy = false; }
}
setInterval(() => {
  const now = Date.now();
  if (S.user && !outBusy) {
    const idle = now - lastAct;
    if (idle >= IDLE) idleOut();
    else if (idle >= IDLE - 30000 && !idleWarn) { idleWarn = true; toast('Sua sessão expira em 30 segundos por inatividade. Mova o mouse ou toque na tela para continuar.', 1); }
  }
  document.querySelectorAll('.cd').forEach(el => el.textContent = mmss(+el.dataset.exp - now));
  const u = S.user;
  if (!u || u.aprovado === false || u.suspenso) return;
  S.data.reqs
    .filter(r => r.status === 'solicitada' && r.tSol + TTL <= now && !expBusy.has(r.id) && (u.role !== 'funcionario' || r.userId === u.uid))
    .forEach(async r => {
      expBusy.add(r.id);
      setTimeout(() => expBusy.delete(r.id), 15000);
      try {
        await B.act('expire', r.id, u);
        if (r.userId === u.uid) toast('Sua reserva de "' + r.keyName + '" expirou (mais de 3 minutos) e foi cancelada.', 1);
      } catch (_) {}
    });
}, 1000);

/* ===================== INÍCIO ===================== */
let unsub = null;
function start(u) {
  if (unsub) { unsub(); unsub = null; }
  S.user = u; S.tab = null;
  lastAct = Date.now(); idleWarn = false;
  if (u && pendLogin && canLog(u)) { pendLogin = false; audit('login', u.nome, 'Perfil: ' + ROLE[u.role]); }
  if (u && u.aprovado !== false && !u.suspenso) unsub = B.listen(u, d => { d.keys.sort((a, b) => a.nome.localeCompare(b.nome)); if (d.me) S.user = d.me; S.data = d; refresh(); });
  else S.data = {keys:[], reqs:[], users:[]};
  render();
}
B.onAuth(start);
</script>
</body>
