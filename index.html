<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAG-ZDC: Sistema de Autorização e Guarda de Chaves V1.0</title>
<style>
:root{--g:#00843d;--gd:#006a31;--gl:#e8f5ee;--r:#cd191e;--bg:#f3f6f4;--tx:#1b2a24;--mu:#5b6b63;--bd:#dfe7e2;--sh:0 1px 2px rgba(16,40,28,.06),0 6px 18px rgba(16,40,28,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column}
small,.hint{color:var(--mu);font-size:14px;margin:0}
.hint{line-height:1.45}

header{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:4px solid var(--r)}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header small{color:#d6f0e0;display:block}
.usr{display:flex;align-items:center;gap:12px}
.usr .who{text-align:right;line-height:1.3}
.usr .who b{display:block;font-size:15px;font-weight:600}

nav{background:#fff;display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--bd);overflow-x:auto;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(16,40,28,.04);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;color:var(--mu);border:0;border-bottom:3px solid transparent;border-radius:0;padding:0 16px;min-height:50px;white-space:nowrap;font-size:15px;font-weight:500}
nav button:hover{background:var(--gl);filter:none}
nav button.on{color:var(--g);border-color:var(--g);font-weight:700}

main{width:100%;max-width:1100px;margin:0 auto;padding:8px 20px 32px;flex:1}
h2{font-size:20px;margin:24px 0 14px;font-weight:700;display:flex;align-items:center;gap:8px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;box-shadow:var(--sh)}
.grid .card{margin:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ch b{font-size:17px;line-height:1.3}
.card button{width:100%;margin-top:4px}
.empty{background:#fff;border:1px dashed #c4d1ca;border-radius:14px;padding:22px;text-align:center;color:var(--mu)}
.note{background:#fff7e0;border:1px solid #f3d98b;color:#7a5600;border-radius:12px;padding:12px 14px;margin-top:16px;font-size:14px}

button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:0 18px;min-height:46px;cursor:pointer;font:inherit;font-weight:600;transition:background .15s,transform .05s}
button:hover{background:var(--gd)}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:not-allowed}
button.sec{background:#e9eeeb;color:#2f4139}
button.sec:hover{background:#dbe3df}
button.out{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.55);min-height:40px;padding:0 16px}
button.out:hover{background:rgba(255,255,255,.28)}
.link{background:none;color:var(--g);padding:0;min-height:40px;text-decoration:underline;font-weight:600}
.link:hover{background:none;color:var(--gd)}

label{font-size:14px;font-weight:600;color:#33453c;display:block;margin-bottom:4px}
input,select{padding:0 14px;min-height:46px;border:1px solid #c6d2cb;border-radius:10px;font:inherit;width:100%;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:3px solid rgba(0,132,61,.22);border-color:var(--g)}
.fld{display:flex;flex-direction:column}
.row{display:flex;gap:10px;flex-wrap:wrap}
.frm input{flex:1 1 200px;width:auto}
.frm button{flex:0 0 auto}

.b{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap;letter-spacing:.2px}
.disponivel,.devolvida{background:#dcfce7;color:#166534}
.reservada,.solicitada,.devolucao{background:#fef3c7;color:#92400e}
.em_uso,.retirada{background:#fee2e2;color:#991b1b}

.n{background:var(--g);color:#fff;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700}

.tw{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:14px;margin-top:12px;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #edf2ef;white-space:nowrap}
th{background:#f6f9f7;color:#3d4f46;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
tbody tr:hover{background:#fafcfb}
tr:last-child td{border-bottom:0}
td select{min-width:150px}

.hb{display:flex;align-items:center;gap:12px}
.hlogo{background:#fff;border-radius:10px;padding:5px 8px;display:flex;flex:0 0 auto}
.hlogo img{height:42px;width:auto;display:block}
header small a{color:#fff;font-weight:600}

.lw{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px;position:relative;overflow:hidden;background:radial-gradient(900px 500px at 8% 0%,rgba(0,132,61,.20),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(205,25,30,.10),transparent 60%),linear-gradient(180deg,#eef5f0,#e0ebe4)}
.lw::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,106,49,.18) 1px,transparent 1.3px);background-size:22px 22px;pointer-events:none}
.lcard{position:relative;z-index:1;width:100%;max-width:880px;display:grid;grid-template-columns:5fr 6fr;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(10,50,30,.22),0 2px 6px rgba(10,50,30,.10)}
.brand{position:relative;color:#fff;text-align:center;padding:40px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px),radial-gradient(circle at 20% 12%,rgba(255,255,255,.20),transparent 45%),linear-gradient(160deg,#00a04a,#006a31 60%,#004d24)}
.brand::after{content:"";position:absolute;top:0;right:0;bottom:0;width:5px;background:var(--r)}
.logo{display:flex;margin-bottom:4px}
.logo img{display:block;height:120px;width:auto;max-width:240px;object-fit:contain;filter:invert(1) grayscale(1) brightness(20);mix-blend-mode:screen}
.brand h1{margin:6px 0 0;font-size:36px;font-weight:800;letter-spacing:1.5px}
.brand .bn{margin:0;font-size:15px;line-height:1.45;color:#d6f0e0;max-width:260px}
.brand a{color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:99px;padding:7px 18px;font-size:14px;font-weight:600;text-decoration:none;margin-top:6px;background:rgba(255,255,255,.10)}
.brand a:hover{background:rgba(255,255,255,.25)}
.login{width:100%;padding:40px 34px;display:flex;flex-direction:column;justify-content:center;gap:14px;background:linear-gradient(180deg,#fff,#f9fcfa)}
.login form{display:flex;flex-direction:column;gap:14px}
.login h3{margin:0 0 2px;font-size:24px;font-weight:700;color:var(--gd)}
@media(max-width:700px){.lw{padding:16px 12px}.lcard{grid-template-columns:1fr}.brand{padding:28px 20px}.brand::after{top:auto;left:0;width:auto;height:5px}.brand h1{font-size:28px}.logo img{height:64px}}

#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,30,22,.55);backdrop-filter:blur(3px)}
#modal.on{display:flex}
.dlg{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);border-top:5px solid var(--r)}
.dlg h3{margin:0;font-size:20px}
.dlg p{margin:0;color:var(--mu);font-size:15px}
.dlg .row button{flex:1}
button.dg{background:var(--r)}
button.dg:hover{background:#a81418}

pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:12px;overflow:auto;font-size:12.5px;line-height:1.5}
code{background:#e9eeeb;padding:1px 6px;border-radius:5px;font-size:13px}
ol li{margin-bottom:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15px}
#toast.err{background:#b91c1c}
.demo{background:#fef3c7;color:#92400e;padding:8px 20px;font-size:13px;text-align:center}

footer{background:#fff;border-top:1px solid var(--bd);text-align:center;padding:18px 16px;font-size:14px;color:var(--mu)}
footer a{color:var(--g);font-weight:700;text-decoration:none}
footer a:hover{text-decoration:underline}

@media(max-width:700px){
  header{padding:12px 16px}
  header h1{font-size:18px}
  .usr{width:100%;justify-content:space-between}
  .usr .who{text-align:left}
  main{padding:4px 14px 28px}
  h2{font-size:19px;margin:20px 0 12px}
  .grid{grid-template-columns:1fr}
  nav{padding:0 6px}
  nav button{padding:0 14px}
  .frm button{width:100%}
  .login{padding:24px 18px}

  .tw{background:none;border:0;box-shadow:none;overflow:visible}
  .rt thead{display:none}
  .rt,.rt tbody,.rt tr,.rt td{display:block;width:100%}
  .rt tr{background:#fff;border:1px solid var(--bd);border-radius:14px;margin-bottom:12px;padding:8px 14px;box-shadow:var(--sh)}
  .rt td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;padding:6px 0;white-space:normal;text-align:right;font-size:14px}
  .rt td::before{content:attr(data-label);font-weight:600;color:var(--mu);text-align:left;flex:0 0 auto}
  .rt td select{min-width:0;width:60%}
  .rt td.act{padding-top:10px}
  .rt td.act::before{content:none}
  .rt td.act button{width:100%}
}
</style>

<script type="module">
/* ========= CONFIGURAÇÃO FIREBASE ========= */
const firebaseConfig = {
  apiKey: "AIzaSyBla3XVETm1J4HmDFh-nkSp60j5m_vXkA8",
  authDomain: "controle-chaves-2153d.firebaseapp.com",
  projectId: "controle-chaves-2153d",
  storageBucket: "controle-chaves-2153d.firebasestorage.app",
  messagingSenderId: "413322865098",
  appId: "1:413322865098:web:bbacfc276e487528bb4733"
};
/* ========================================== */

const CDN = 'https://www.gstatic.com/firebasejs/10.12.0';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => t ? new Date(t).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '—';
const uid = () => Math.random().toString(36).slice(2, 10);

function toast(m, err) {
  const t = $('#toast'); t.textContent = m; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3600);
}
const ERR = {
  'auth/invalid-credential': 'E-mail ou senha inválidos.',
  'auth/email-already-in-use': 'E-mail já cadastrado.',
  'auth/weak-password': 'Senha fraca (mínimo 6 caracteres).',
  'auth/too-many-requests': 'Muitas tentativas. Aguarde e tente novamente.',
  'permission-denied': 'Sem permissão para esta ação.'
};
const msg = e => ERR[e.code] || e.message;

/* Fluxo: solicitada -> retirada -> devolucao -> devolvida */
const T = {
  deliver:  {from:'solicitada', to:'retirada',  ts:'tRet',    who:'guardaRet', key:'em_uso'},
  giveBack: {from:'retirada',   to:'devolucao', ts:'tDevSol',                  key:'em_uso'},
  receive:  {from:'devolucao',  to:'devolvida', ts:'tDev',    who:'guardaDev', key:'disponivel'},
  cancel:   {from:'solicitada', to:'cancelada', ts:'tCanc',                    key:'disponivel'}
};
const L = {disponivel:'Disponível', reservada:'Aguardando entrega', em_uso:'Em uso', solicitada:'Aguardando entrega',
  retirada:'Em uso', devolucao:'Aguardando recebimento', devolvida:'Devolvida', cancelada:'Cancelada'};
const badge = s => `<span class="b ${s}">${L[s]}</span>`;
const CARGOS = ['Professor', 'Administrativo (TAE)', 'Terceirizado', 'Guarda'];

/* ===================== BACKEND: DEMO (memória) ===================== */
function makeDemo() {
  const d = {
    users: [
      {uid:'u1', nome:'Maria Souza', email:'funcionario@ifma.edu.br', siape:'1234567', cargo:'Professor', role:'funcionario'},
      {uid:'u2', nome:'João (Guarda)', email:'guarda@ifma.edu.br', siape:'—', cargo:'Guarda', role:'guarda'},
      {uid:'u3', nome:'Admin TI', email:'admin@ifma.edu.br', siape:'—', cargo:'Administrativo (TAE)', role:'admin'}
    ],
    keys: ['Sala 101|Bloco A','Sala 102|Bloco A','Laboratório de Informática|Bloco B','Laboratório de Química|Bloco B',
      'Biblioteca|Bloco C','Auditório|Bloco C','Sala dos Professores|Bloco A','Coordenação|Administrativo']
      .map(s => {const [nome, local] = s.split('|'); return {id:uid(), nome, local, status:'disponivel'};}),
    reqs: []
  };
  let fn = () => {};
  const emit = () => fn({keys:d.keys.map(x => ({...x})), reqs:d.reqs.map(x => ({...x})), users:d.users.map(x => ({...x}))});
  return {
    demo: true, authCb: () => {},
    onAuth(f) { this.authCb = f; f(null); },
    async login(email) {
      const u = d.users.find(x => x.email === email);
      if (!u) throw Error('Modo demo: use os botões de acesso rápido.');
      this.authCb({...u});
    },
    async register() { throw Error('Cadastro disponível apenas com Firebase configurado.'); },
    async logout() { this.authCb(null); },
    async confirmPass(p) { if (!p) throw Error('Informe a senha.'); },
    listen(u, f) { fn = f; emit(); return () => {}; },
    async request(k, u) {
      const kk = d.keys.find(x => x.id === k.id);
      if (kk.status !== 'disponivel') throw Error('Chave indisponível.');
      kk.status = 'reservada';
      d.reqs.unshift({id:uid(), keyId:kk.id, keyName:kk.nome, userId:u.uid, userName:u.nome, status:'solicitada', tSol:Date.now()});
      emit();
    },
    async act(a, id, u) {
      const t = T[a], r = d.reqs.find(x => x.id === id);
      if (r.status !== t.from) throw Error('Status já foi alterado.');
      r.status = t.to; r[t.ts] = Date.now(); if (t.who) r[t.who] = u.nome;
      d.keys.find(x => x.id === r.keyId).status = t.key; emit();
    },
    async addKey(k) { d.keys.push({id:uid(), ...k, status:'disponivel'}); emit(); },
    async delKey(id) { d.keys = d.keys.filter(x => x.id !== id); emit(); },
    async setRole(id, role) { d.users.find(x => x.uid === id).role = role; emit(); },
    async setApproval(id, ok) { d.users.find(x => x.uid === id).aprovado = ok; emit(); },
    async rejectUser(id) { d.users = d.users.filter(x => x.uid !== id); emit(); },
    async me() { return S.user; }
  };
}

/* ===================== BACKEND: FIREBASE ===================== */
async function makeFB() {
  const [{initializeApp}, A, F] = await Promise.all(['app','auth','firestore'].map(m => import(`${CDN}/firebase-${m}.js`)));
  const app = initializeApp(firebaseConfig), auth = A.getAuth(app), db = F.getFirestore(app);
  const col = n => F.collection(db, n), ref = (n, id) => F.doc(db, n, id);
  let cb = () => {}, reg = false;
  return {
    demo: false,
    onAuth(f) {
      cb = f;
      A.onAuthStateChanged(auth, async u => {
        if (reg) return;
        if (!u) return f(null);
        const s = await F.getDoc(ref('users', u.uid));
        if (!s.exists()) { toast('Cadastro recusado ou inexistente.', 1); await A.signOut(auth); return f(null); }
        f({uid:u.uid, ...s.data()});
      });
    },
    async login(e, p) { await A.signInWithEmailAndPassword(auth, e, p); },
    async register(nome, siape, cargo, e, p) {
      reg = true;
      try {
        const c = await A.createUserWithEmailAndPassword(auth, e, p);
        const prof = {nome, siape, cargo, email:e, role:'funcionario', aprovado:false, tCad:Date.now()};
        await F.setDoc(ref('users', c.user.uid), prof);
        cb({uid:c.user.uid, ...prof});
      } finally { reg = false; }
    },
    logout() { return A.signOut(auth); },
    async confirmPass(p) {
      const u = auth.currentUser;
      try { await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, p)); }
      catch (e) {
        if (/credential|password/.test(e.code || '')) throw Error('Senha incorreta.');
        throw e;
      }
    },
    listen(u, fn) {
      const st = {keys:[], reqs:[], users:[]}, emit = () => fn({...st});
      const q = u.role === 'funcionario'
        ? F.query(col('requests'), F.where('userId', '==', u.uid))
        : F.query(col('requests'), F.orderBy('tSol', 'desc'), F.limit(300));
      const un = [
        F.onSnapshot(col('keys'), s => { st.keys = s.docs.map(d => ({id:d.id, ...d.data()})); emit(); }),
        F.onSnapshot(q, s => { st.reqs = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a, b) => b.tSol - a.tSol); emit(); }, e => toast(msg(e), 1))
      ];
      if (u.role === 'admin') un.push(F.onSnapshot(col('users'), s => { st.users = s.docs.map(d => ({uid:d.id, ...d.data()})); emit(); }));
      return () => un.forEach(f => f());
    },
    async request(k, u) {
      const kr = ref('keys', k.id), rr = F.doc(col('requests'));
      await F.runTransaction(db, async t => {
        const s = await t.get(kr);
        if (s.data().status !== 'disponivel') throw Error('Chave indisponível.');
        t.update(kr, {status:'reservada'});
        t.set(rr, {keyId:k.id, keyName:k.nome, userId:u.uid, userName:u.nome, status:'solicitada', tSol:Date.now()});
      });
    },
    async act(a, id, u) {
      const t = T[a], rr = ref('requests', id);
      await F.runTransaction(db, async tx => {
        const r = (await tx.get(rr)).data();
        if (r.status !== t.from) throw Error('Status já foi alterado.');
        const up = {status:t.to, [t.ts]:Date.now()};
        if (t.who) up[t.who] = u.nome;
        tx.update(rr, up);
        tx.update(ref('keys', r.keyId), {status:t.key});
      });
    },
    addKey(k) { return F.addDoc(col('keys'), {...k, status:'disponivel'}); },
    delKey(id) { return F.deleteDoc(ref('keys', id)); },
    setRole(id, role) { return F.updateDoc(ref('users', id), {role}); },
    setApproval(id, ok) { return F.updateDoc(ref('users', id), {aprovado:ok}); },
    rejectUser(id) { return F.deleteDoc(ref('users', id)); },
    async me() { const u = auth.currentUser; const s = await F.getDoc(ref('users', u.uid)); return {uid:u.uid, ...s.data()}; }
  };
}

const B = firebaseConfig.apiKey === 'SUA_API_KEY' ? makeDemo() : await makeFB();

/* ===================== ESTADO E VIEWS ===================== */
const S = {user:null, data:{keys:[], reqs:[], users:[]}, tab:null, q:'', mode:'login'};
const TABS = {
  funcionario: [['minhas','Minhas chaves'], ['unidade','Chaves da unidade'], ['hist','Meu histórico']],
  guarda: [['fila','Guarita'], ['hist','Histórico']],
  admin: [['fila','Guarita'], ['sol','Solicitações'], ['hist','Histórico'], ['keys','Gerenciar chaves'], ['users','Usuários'], ['guia','Guia de implantação']]
};
const ROLE = {funcionario:'Funcionário', guarda:'Guarda', admin:'Administrador'};

const pend = () => (S.user.role === 'funcionario' && S.user.cargo === 'Guarda')
  ? `<div class="note">Seu cadastro como Guarda aguarda liberação do administrador. Enquanto isso, você tem acesso de funcionário.</div>` : '';

const vMinhas = () => {
  const mine = S.data.reqs.filter(r => ['solicitada','retirada','devolucao'].includes(r.status));
  return pend() + `<h2>Minhas chaves</h2>` + (mine.length
    ? `<div class="grid">${mine.map(r => `<div class="card"><div class="ch"><b>${esc(r.keyName)}</b>${badge(r.status)}</div>
      <small>Solicitada: ${fmt(r.tSol)}${r.tRet ? `<br>Retirada: ${fmt(r.tRet)}` : ''}</small>
      ${r.status === 'solicitada' ? `<p class="hint">Vá até a guarita para retirar.</p><button class="sec" data-a="cancel" data-id="${r.id}">Cancelar solicitação</button>`
      : r.status === 'retirada' ? `<p class="hint">Clique ao entregar a chave na guarita.</p><button data-a="giveBack" data-id="${r.id}">Devolver chave</button>`
      : `<p class="hint">Aguardando o guarda confirmar o recebimento.</p>`}</div>`).join('')}</div>`
    : `<div class="empty">Nenhuma chave em seu nome.<br><small>Acesse a aba Chaves da unidade para solicitar.</small></div>`);
};

const vUnidade = () => pend() + `<h2>Chaves da unidade</h2>` + (S.data.keys.length
  ? `<div class="grid">${S.data.keys.map(k => `<div class="card"><div class="ch"><b>${esc(k.nome)}</b>${badge(k.status)}</div><small>${esc(k.local)}</small>
    ${k.status === 'disponivel' ? `<button data-a="request" data-id="${k.id}">Solicitar chave</button>` : ''}</div>`).join('')}</div>`
  : `<div class="empty">Nenhuma chave cadastrada.</div>`);

const vFila = () => {
  const by = s => S.data.reqs.filter(r => r.status === s);
  const col = (title, list, btn, act, empty) => `<div><h2>${title} <span class="n">${list.length}</span></h2>
    ${list.length ? list.map(r => `<div class="card"><b>${esc(r.keyName)}</b><small>${esc(r.userName)} · ${fmt(r.tDevSol || r.tRet || r.tSol)}</small>
    ${btn ? `<button data-a="${act}" data-id="${r.id}">${btn}</button>` : ''}</div>`).join('') : `<div class="empty">${empty}</div>`}</div>`;
  return `<div class="cols">
    ${col('Para entregar', by('solicitada'), 'Entregar chave', 'deliver', 'Nenhuma solicitação.')}
    ${col('Para receber', by('devolucao'), 'Confirmar recebimento', 'receive', 'Nenhuma devolução pendente.')}
    ${col('Em uso', by('retirada'), '', '', 'Nenhuma chave em uso.')}</div>`;
};

const histRows = () => {
  const q = S.q.toLowerCase();
  return S.data.reqs.filter(r => !q || (r.keyName + ' ' + r.userName + ' ' + L[r.status]).toLowerCase().includes(q))
    .map(r => `<tr><td data-label="Solicitação">${fmt(r.tSol)}</td><td data-label="Chave">${esc(r.keyName)}</td><td data-label="Funcionário">${esc(r.userName)}</td><td data-label="Status">${badge(r.status)}</td>
    <td data-label="Retirada">${fmt(r.tRet)}</td><td data-label="Devolução">${fmt(r.tDev)}</td><td data-label="Entregue por">${esc(r.guardaRet || '—')}</td><td data-label="Recebida por">${esc(r.guardaDev || '—')}</td></tr>`).join('');
};
const vHist = () => `<h2>Histórico</h2><input id="q" placeholder="Filtrar por chave, pessoa ou status" value="${esc(S.q)}">
  <div class="tw"><table class="rt" id="tbl"><thead><tr><th>Solicitação</th><th>Chave</th><th>Funcionário</th><th>Status</th><th>Retirada</th><th>Devolução</th><th>Entregue por</th><th>Recebida por</th></tr></thead>
  <tbody>${histRows()}</tbody></table></div>`;

const vKeys = () => `<h2>Cadastrar chave</h2>
  <form id="fKey" class="row frm"><input name="nome" placeholder="Nome (ex.: Sala 101)" required><input name="local" placeholder="Local (ex.: Bloco A)" required><button>Adicionar</button></form>
  <h2>Chaves cadastradas</h2>
  <div class="tw"><table class="rt"><thead><tr><th>Chave</th><th>Local</th><th>Status</th><th></th></tr></thead><tbody>
  ${S.data.keys.map(k => `<tr><td data-label="Chave">${esc(k.nome)}</td><td data-label="Local">${esc(k.local)}</td><td data-label="Status">${badge(k.status)}</td><td class="act"><button class="sec" data-a="delKey" data-id="${k.id}">Excluir</button></td></tr>`).join('')}
  </tbody></table></div>`;

const vUsers = () => `<h2>Usuários e perfis</h2><p class="hint">Novos cadastros entram como Funcionário. Quem se cadastrou como Guarda deve ser promovido aqui.</p>
  <div class="tw"><table class="rt"><thead><tr><th>Nome</th><th>Cargo</th><th>E-mail</th><th>SIAPE</th><th>Perfil</th></tr></thead><tbody>
  ${S.data.users.filter(u => u.aprovado !== false).map(u => `<tr><td data-label="Nome">${esc(u.nome)}</td><td data-label="Cargo">${esc(u.cargo || '—')}</td><td data-label="E-mail">${esc(u.email)}</td><td data-label="SIAPE">${esc(u.siape)}</td><td data-label="Perfil">
  <select data-a="role" data-id="${u.uid}">${Object.entries(ROLE).map(([k, v]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td></tr>`).join('')}
  </tbody></table></div>`;

const vSol = () => {
  const p = S.data.users.filter(u => u.aprovado === false);
  return `<h2>Solicitações de cadastro <span class="n">${p.length}</span></h2>` + (p.length
    ? `<div class="grid">${p.map(u => `<div class="card"><div class="ch"><b>${esc(u.nome)}</b><span class="b solicitada">Pendente</span></div>
      <small>${esc(u.cargo || '—')} · SIAPE: ${esc(u.siape)}<br>${esc(u.email)}<br>Cadastro: ${fmt(u.tCad)}</small>
      <div class="row"><button style="flex:1;width:auto" data-a="approve" data-id="${u.uid}">Autorizar</button><button class="sec" style="flex:1;width:auto" data-a="reject" data-id="${u.uid}">Recusar</button></div></div>`).join('')}</div>`
    : `<div class="empty">Nenhuma solicitação pendente.</div>`);
};

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function role() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role; }
    function staff() { return request.auth != null && role() in ['guarda','admin']; }
    function approved() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.get('aprovado', true) != false; }
    match /users/{id} {
      allow read: if request.auth != null;
      allow create: if request.auth.uid == id && request.resource.data.role == 'funcionario' && request.resource.data.aprovado == false;
      allow update, delete: if request.auth != null && role() == 'admin';
    }
    match /keys/{id} {
      allow read: if request.auth != null;
      allow create, delete: if request.auth != null && role() == 'admin';
      allow update: if request.auth != null && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status']);
    }
    match /requests/{id} {
      allow read: if staff() || (request.auth != null && resource.data.userId == request.auth.uid);
      allow create: if request.auth != null && approved() && request.resource.data.userId == request.auth.uid && request.resource.data.status == 'solicitada';
      allow update: if staff() || (request.auth != null && resource.data.userId == request.auth.uid && request.resource.data.status in ['devolucao','cancelada']);
    }
  }
}`;
const vGuia = () => `<h2>Guia de implantação</h2><ol>
  <li><b>Firebase Console</b> → criar projeto → <i>Authentication</i> → ativar <b>E-mail/senha</b> → <i>Firestore Database</i> → criar em modo produção.</li>
  <li><i>Configurações do projeto</i> → <i>Seus apps</i> → app Web → copiar a config para <code>firebaseConfig</code> no início do script.</li>
  <li>Firestore → <i>Regras</i> → colar as regras abaixo e publicar.</li>
  <li><b>Primeiro admin:</b> cadastre-se no app e, no Firestore, edite <code>users/{uid}.role</code> para <code>admin</code> e <code>aprovado</code> para <code>true</code>. Depois promova guardas na aba Usuários.</li>
  <li><b>GitHub:</b> crie um repositório, envie o <code>index.html</code> → <i>Settings → Pages</i> → branch <code>main</code> / root.</li>
  <li>Firebase → Authentication → <i>Configurações → Domínios autorizados</i> → adicionar <code>seu-usuario.github.io</code>.</li>
  <li>Cadastre as chaves na aba <i>Gerenciar chaves</i>.</li></ol>
  <h2>Regras do Firestore</h2><pre>${esc(RULES)}</pre>
  <p class="hint">Fluxo: Funcionário solicita → Guarda entrega → Funcionário devolve → Guarda confirma recebimento. Para produção rigorosa, mova as transições para Cloud Functions.</p>`;

const loginHTML = () => `<div class="lw"><div class="lcard"><aside class="brand"><div class="logo"><img src="ifma.png" alt="IFMA" onerror="this.parentNode.style.display='none'"></div><h1>SAG-ZDC</h1><p class="bn">Sistema de Autorização e Guarda de Chaves V1.0</p><a href="https://zedoca.ifma.edu.br/" target="_blank" rel="noopener">IFMA Campus Zé Doca</a></aside><div class="login"><h3>${S.mode === 'login' ? 'Acessar o sistema' : 'Criar conta'}</h3>
  ${S.mode === 'login'
    ? `<form id="fLogin"><div class="fld"><label>E-mail</label><input name="email" type="email" placeholder="seu@email.com" autocomplete="email" required></div>
       <div class="fld"><label>Senha</label><input name="senha" type="password" placeholder="Sua senha" autocomplete="current-password" required></div><button>Entrar</button></form>
       ${B.demo ? '' : `<button class="link" data-a="mode" data-id="reg">Primeiro acesso? Cadastre-se</button>`}`
    : `<form id="fReg"><div class="fld"><label>Nome completo</label><input name="nome" placeholder="Nome completo" autocomplete="name" required></div>
       <div class="fld"><label>Cargo</label><select name="cargo" required><option value="">Selecione o cargo</option>${CARGOS.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
       <div class="fld"><label>SIAPE / matrícula (opcional)</label><input name="siape" placeholder="Se houver"></div>
       <div class="fld"><label>E-mail</label><input name="email" type="email" placeholder="seu@email.com" autocomplete="email" required></div>
       <div class="fld"><label>Senha</label><input name="senha" type="password" minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required></div>
       <div class="fld"><label>Confirmar senha</label><input name="senha2" type="password" minlength="6" placeholder="Repita a senha" autocomplete="new-password" required></div><button>Cadastrar</button></form>
       <button class="link" data-a="mode" data-id="login">Já tenho conta</button>`}
  ${B.demo ? `<hr style="width:100%;border:0;border-top:1px solid #e2e8f0"><small>Modo demonstração — acesso rápido:</small>
    <button class="sec" data-a="demo" data-id="funcionario@ifma.edu.br">Entrar como Funcionário</button>
    <button class="sec" data-a="demo" data-id="guarda@ifma.edu.br">Entrar como Guarda</button>
    <button class="sec" data-a="demo" data-id="admin@ifma.edu.br">Entrar como Admin</button>` : ''}</div></div></div>`;

function render() {
  const u = S.user;
  if (!u) { $('#app').innerHTML = loginHTML(); return; }
  if (u.aprovado === false) {
    $('#app').innerHTML = `<div class="lw"><div class="lcard" style="max-width:480px;grid-template-columns:1fr"><div class="login" style="text-align:center"><h3>Aguardando autorização</h3>
      <p class="hint">Olá, ${esc(u.nome)}. Seu cadastro foi enviado e precisa ser autorizado pelo administrador antes do primeiro acesso.</p>
      <button data-a="recheck">Verificar autorização</button><button class="sec" data-a="logout">Sair</button></div></div></div>`;
    return;
  }
  const tabs = TABS[u.role] || TABS.funcionario;
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  const V = {minhas:vMinhas, unidade:vUnidade, fila:vFila, sol:vSol, hist:vHist, keys:vKeys, users:vUsers, guia:vGuia};
  const npend = S.data.users.filter(x => x.aprovado === false).length;
  const papel = u.role === 'funcionario' && u.cargo ? u.cargo : ROLE[u.role];
  $('#app').innerHTML = `${B.demo ? '<div class="demo">Modo demonstração: dados em memória. Configure o Firebase para uso real.</div>' : ''}
    <header><div class="hb"><span class="hlogo"><img src="ifma.png" alt="IFMA" onerror="this.parentNode.style.display='none'"></span><div><h1>SAG-ZDC</h1><small>Sistema de Autorização e Guarda de Chaves V1.0<br><a href="https://zedoca.ifma.edu.br/" target="_blank" rel="noopener">IFMA Campus Zé Doca</a></small></div></div>
    <div class="usr"><div class="who"><b>${esc(u.nome)}</b><small>${esc(papel)}</small></div><button class="out" data-a="logout">Sair</button></div></header>
    <nav>${tabs.map(t => `<button class="${S.tab === t[0] ? 'on' : ''}" data-a="tab" data-id="${t[0]}">${t[1]}${t[0] === 'sol' && npend ? ` <span class="n">${npend}</span>` : ''}</button>`).join('')}</nav>
    <main id="main">${V[S.tab]()}</main>`;
}
function refresh() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#main') && /INPUT|SELECT/.test(a.tagName)) return;
  render();
}

function openDel(k) {
  S.del = k.id;
  const m = $('#modal');
  m.innerHTML = `<form id="fDel" class="dlg" autocomplete="off"><h3>Excluir chave</h3>
    <p>Deseja realmente excluir o registro da chave <b>${esc(k.nome)}</b>? Esta ação não pode ser desfeita.</p>
    <div class="fld"><label>Senha da conta do administrador</label><input name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required></div>
    <div class="row"><button type="button" class="sec" data-a="closeModal">Cancelar</button><button class="dg">Excluir definitivamente</button></div></form>`;
  m.classList.add('on');
  m.querySelector('input').focus();
}
function closeModal() { S.del = null; const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }

/* ===================== EVENTOS ===================== */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.tagName === 'SELECT') return;
  const a = b.dataset.a, id = b.dataset.id;
  try {
    if (a === 'tab') { S.tab = id; render(); return; }
    if (a === 'mode') { S.mode = id; render(); return; }
    if (a === 'demo') { await B.login(id); return; }
    if (a === 'closeModal') { closeModal(); return; }
    if (a === 'logout') { await B.logout(); return; }
    if (a === 'recheck') {
      const m = await B.me();
      if (m.aprovado === false) toast('Ainda aguardando autorização.', 1); else start(m);
      return;
    }
    b.disabled = true;
    if (a === 'request') { await B.request(S.data.keys.find(k => k.id === id), S.user); toast('Chave solicitada! Retire na guarita.'); S.tab = 'minhas'; render(); }
    else if (T[a]) { await B.act(a, id, S.user); toast('Registrado com sucesso.'); }
    else if (a === 'approve') { await B.setApproval(id, true); toast('Conta autorizada.'); }
    else if (a === 'reject') { await B.rejectUser(id); toast('Solicitação recusada.'); }
    else if (a === 'delKey') {
      const k = S.data.keys.find(k => k.id === id);
      if (k.status !== 'disponivel') throw Error('Chave em uso não pode ser excluída.');
      b.disabled = false; openDel(k);
    }
  } catch (err) { toast(msg(err), 1); b.disabled = false; }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, v = Object.fromEntries(new FormData(f));
  try {
    if (f.id === 'fLogin') await B.login(v.email, v.senha);
    else if (f.id === 'fReg') {
      if (v.senha !== v.senha2) throw Error('As senhas não conferem.');
      await B.register(v.nome.trim(), v.siape.trim() || '—', v.cargo, v.email, v.senha);
      toast('Cadastro enviado. Aguarde a autorização do administrador.');
    }
    else if (f.id === 'fKey') { await B.addKey({nome:v.nome.trim(), local:v.local.trim()}); f.reset(); }
    else if (f.id === 'fDel') {
      if (S.user.role !== 'admin') throw Error('Apenas administradores podem excluir chaves.');
      const btn = f.querySelector('.dg'); btn.disabled = true;
      try { await B.confirmPass(v.senha); await B.delKey(S.del); closeModal(); toast('Chave excluída.'); }
      catch (err) { btn.disabled = false; throw err; }
    }
  } catch (err) { toast(msg(err), 1); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; $('#tbl tbody').innerHTML = histRows(); }
});
document.addEventListener('change', async e => {
  if (e.target.dataset.a === 'role') {
    try { await B.setRole(e.target.dataset.id, e.target.value); toast('Perfil atualizado.'); }
    catch (err) { toast(msg(err), 1); }
  }
});

/* ===================== INÍCIO ===================== */
let unsub = null;
function start(u) {
  if (unsub) { unsub(); unsub = null; }
  S.user = u; S.tab = null;
  if (u && u.aprovado !== false) unsub = B.listen(u, d => { d.keys.sort((a, b) => a.nome.localeCompare(b.nome)); S.data = d; refresh(); });
  else S.data = {keys:[], reqs:[], users:[]};
  render();
}
B.onAuth(start);
</script>
</body>
</html>
